# Catálogo de indicadores ENAHO (Vivienda + Sumaria).
# Cada indicador se define una sola vez. Para agregar uno nuevo, añádelo aquí.
#   type        : proporcion | promedio | total
#   weight_unit : hogar (peso factor07) | persona (peso factor07*mieperho)
#   format      : porcentaje | soles | conteo
#   crossable   : true si puede cruzarse con condición de pobreza
#   category_var: columna factor de la base para el desglose por etiquetas (drill-down)
#   levels_allowed: niveles de inferencia publicables para el indicador
version: "1.0"
indicators:

  pobreza_total:
    title: "Incidencia de pobreza monetaria total"
    description: "Porcentaje de personas en situacion de pobreza monetaria"
    module: sumaria
    variable: pobre_total
    category_var: cat_pobreza
    type: proporcion
    weight_unit: persona
    format: porcentaje
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - Informe tecnico: Evolucion de la Pobreza Monetaria 2024"

  pobreza_extrema:
    title: "Incidencia de pobreza monetaria extrema"
    description: "Porcentaje de personas en situacion de pobreza extrema"
    module: sumaria
    variable: pobre_extremo
    category_var: cat_pobreza
    type: proporcion
    weight_unit: persona
    format: porcentaje
    levels_allowed: [nacional, area, region_natural]
    official_source: "INEI - Informe tecnico: Evolucion de la Pobreza Monetaria 2024"

  gasto_pc:
    title: "Gasto per capita mensual promedio"
    description: "Gasto per capita mensual promedio (nominal, soles corrientes)"
    module: sumaria
    variable: gpc_mensual
    type: promedio
    weight_unit: persona
    format: soles
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO (gasto real requiere deflactor espacial, ver nota)"

  agua_red_publica:
    title: "Hogares con agua por red publica"
    description: "Porcentaje de hogares que se abastecen de agua por red publica"
    module: vivienda
    variable: agua_red
    category_var: cat_agua
    rest_label: "Sin red pública"
    type: proporcion
    weight_unit: hogar
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - Formas de Acceso al Agua y Saneamiento"

  desague_red_publica:
    title: "Hogares con desague por red publica"
    description: "Porcentaje de hogares con servicio higienico conectado a red publica"
    module: vivienda
    variable: desague_red
    category_var: cat_desague
    rest_label: "Sin red pública"
    type: proporcion
    weight_unit: hogar
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - Formas de Acceso al Agua y Saneamiento"

  electricidad:
    title: "Hogares con alumbrado electrico"
    description: "Porcentaje de hogares con alumbrado por red electrica"
    module: vivienda
    variable: electricidad
    category_var: cat_electric
    type: proporcion
    weight_unit: hogar
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - Condiciones de vida"

  # Indicadores a nivel de persona (base: persona).
  # Cada uno sale de su módulo y usa su propio factor de expansión (weight_var).

  analfabetismo:
    title: "Tasa de analfabetismo (15 y mas)"
    description: "Porcentaje de personas de 15 y mas años que no saben leer ni escribir"
    module: educacion
    base: persona
    variable: analfabeto
    category_var: cat_alfab
    type: proporcion
    weight_unit: persona
    weight_var: w_edu
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO Modulo 300 (Educacion)"

  seguro_salud:
    title: "Poblacion con seguro de salud"
    description: "Porcentaje de personas afiliadas a algun seguro de salud"
    module: salud
    base: persona
    variable: con_seguro
    type: proporcion
    weight_unit: persona
    weight_var: w_salud
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO Modulo 400 (Salud)"

  tasa_ocupacion:
    title: "Tasa de ocupacion (PET 14 y mas)"
    description: "Porcentaje de ocupados respecto a la poblacion en edad de trabajar"
    module: empleo
    base: persona
    variable: ocupado
    category_var: cat_ocupacion
    type: proporcion
    weight_unit: persona
    weight_var: w_empleo
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO Modulo 500 (Empleo)"

  asistencia_secundaria:
    title: "Tasa neta de asistencia a educacion secundaria (12-16 años)"
    description: "Porcentaje de adolescentes de 12 a 16 años que asisten a educacion secundaria"
    module: educacion
    base: persona
    variable: asiste_secundaria
    category_var: cat_asis_sec
    type: proporcion
    weight_unit: persona
    weight_var: w_sec
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO Modulo 300 (Educacion)"

  problema_salud_cronico:
    title: "Poblacion con algun problema de salud cronico"
    description: "Porcentaje de personas que padecen de alguna enfermedad o malestar cronico"
    module: salud
    base: persona
    variable: cronico
    category_var: cat_cronico
    type: proporcion
    weight_unit: persona
    weight_var: w_salud
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO Modulo 400 (Salud)"

  empleo_informal:
    title: "Tasa de empleo informal"
    description: "Porcentaje de la PEA ocupada con empleo informal (metodologia OIT/INEI)"
    module: empleo
    base: persona
    variable: empleo_informal
    category_var: cat_informal
    type: proporcion
    weight_unit: persona
    weight_var: w_informal
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO Modulo 500 (Empleo); empleo informal OIT 17a CIET"

  tasa_desempleo:
    title: "Tasa de desempleo (abierto)"
    description: "Porcentaje de la PEA desocupada (busco trabajo activamente) respecto a la PEA; definicion OIT de desempleo abierto"
    module: empleo
    base: persona
    variable: desempleo
    category_var: cat_desempleo
    type: proporcion
    weight_unit: persona
    weight_var: w_pea
    format: porcentaje
    crossable: true
    levels_allowed: [nacional, area, region_natural, departamento]
    official_source: "INEI - ENAHO Modulo 500 (Empleo); tasa de desempleo abierto OIT"
